name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_suffix: win-x64
            executable: stressor.exe
          - os: ubuntu-latest
            rid: linux-x64
            archive_suffix: linux-x64
            executable: stressor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish src/Stressor.App/Stressor.App.csproj -c Release -r ${{ matrix.rid }} -o publish

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.executable }}" -DestinationPath "dist/stressor-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.zip"

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          chmod +x "publish/${{ matrix.executable }}"
          cd publish
          zip -j "../dist/stressor-${{ steps.version.outputs.version }}-${{ matrix.archive_suffix }}.zip" "${{ matrix.executable }}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: stressor-${{ matrix.archive_suffix }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
