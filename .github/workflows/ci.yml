name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: artifacts/publish/stressor
          - os: windows-latest
            rid: win-x64
            executable: artifacts/publish/stressor.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Stressor.slnx

      - name: Format check
        run: dotnet format Stressor.slnx --verify-no-changes

      - name: Build
        run: dotnet build Stressor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Stressor.slnx -c Release --no-build --verbosity normal

      - name: Publish smoke
        shell: bash
        run: |
          dotnet publish src/Stressor.App/Stressor.App.csproj -c Release -r ${{ matrix.rid }} -o artifacts/publish
          if [ "${{ runner.os }}" = "Windows" ]; then
            artifacts/publish/stressor.exe --version
          else
            chmod +x artifacts/publish/stressor
            artifacts/publish/stressor --version
          fi
