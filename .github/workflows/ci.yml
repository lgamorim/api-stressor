name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Stressor.slnx

      - name: Format check
        run: dotnet format Stressor.slnx --verify-no-changes

      - name: Build
        run: dotnet build Stressor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Stressor.slnx -c Release --no-build --verbosity normal
